<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dave's Tunes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0a6b55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dave's Tunes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@400;700&family=Zilla+Slab:wght@600;700&display=swap">
<style>
/* Layout: one column songbook. List view, then a song "stage" with a fixed control bar at the bottom. Big targets throughout. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --ink: #16201d;
  --muted: #56635e;
  --line: #d6ddda;
  --edge: #8fa39b;
  --accent: #0a6b55;
  --accent-ink: #ffffff;
  --accent-soft: #e0efe9;
  --danger: #b42318;
  --font-display: "Zilla Slab", Georgia, "Times New Roman", serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-lyrics: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1413; --surface: #171e1c; --ink: #edf3f0; --muted: #9db0a8; --line: #2a3532; --edge: #5f7770;
    --accent: #45c79f; --accent-ink: #062219; --accent-soft: #163029; --danger: #ff7b6e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1413; --surface: #171e1c; --ink: #edf3f0; --muted: #9db0a8; --line: #2a3532; --edge: #5f7770;
  --accent: #45c79f; --accent-ink: #062219; --accent-soft: #163029; --danger: #ff7b6e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 18px; line-height: 1.45;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; }

/* ---------- Buttons ---------- */
.btn {
  min-height: 56px; padding: 0 20px; border-radius: 14px; border: 2px solid var(--edge);
  background: var(--surface); font-weight: 700; font-size: 18px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); border-color: currentColor; background: transparent; }
.btn.ghost { min-height: 52px; padding: 0 14px; }
.btn.icon { width: 56px; padding: 0; }
.btn.icon svg { width: 30px; height: 30px; }
.topbar .btn { flex: none; }
.btn svg { width: 24px; height: 24px; flex: none; }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); display: flex; align-items: center; gap: 12px;
  padding-block: 12px; border-bottom: 1px solid var(--line);
}
.topbar h1 {
  font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.1;
  margin: 0; flex: 1; min-width: 0; text-wrap: balance;
}
.topbar h1.logo { display: flex; }
.topbar h1.logo img { width: 60px; height: 60px; display: block; }
.topbar .small-title {
  font-family: var(--font-display); font-weight: 600; font-size: 22px; margin: 0;
  flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ---------- List view ---------- */
.search {
  margin-top: 16px; display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 2px solid var(--edge); border-radius: 16px; padding: 0 16px;
}
.search:focus-within { border-color: var(--accent); }
.search svg { width: 26px; height: 26px; color: var(--muted); flex: none; }
.search input {
  flex: 1; min-width: 0; border: 0; background: transparent; font-size: 20px; min-height: 60px; outline: none;
}
.count { color: var(--muted); font-size: 16px; margin: 16px 4px 8px; }
.songs { list-style: none; margin: 0 0 120px; padding: 0; display: grid; gap: 10px; }
.song-row {
  width: 100%; text-align: left; display: flex; align-items: center; gap: 14px;
  background: var(--surface); border: 2px solid var(--edge); border-radius: 16px;
  padding: 14px 16px; min-height: 76px;
}
.song-row:active { border-color: var(--accent); }
.song-row .info { flex: 1; min-width: 0; }
.song-row .t { font-weight: 700; font-size: 21px; line-height: 1.2; display: block; overflow-wrap: anywhere; }
.song-row .a { color: var(--muted); font-size: 16px; display: block; }
.tag {
  display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin-left: 6px;
  vertical-align: 2px;
}
.capo-chip {
  flex: none; font-family: var(--font-lyrics); font-weight: 700; font-size: 22px;
  background: var(--accent-soft); color: var(--accent); border-radius: 12px; padding: 8px 12px;
  font-variant-numeric: tabular-nums;
}
.empty { text-align: center; color: var(--muted); padding: 40px 12px; font-size: 19px; }
.fab {
  position: fixed; z-index: 6;
  right: calc(var(--gutter-r) + 4px); bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  min-height: 64px; padding: 0 24px; border-radius: 32px; font-size: 20px;
  box-shadow: 0 6px 20px rgba(0,0,0,.18);
}

/* ---------- Song view ---------- */
.song-head { padding-block: 20px 8px; display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.song-head .names { flex: 1 1 260px; min-width: 0; }
.song-head h2 {
  font-family: var(--font-display); font-weight: 700; font-size: 36px; line-height: 1.1; margin: 0;
  text-wrap: balance; overflow-wrap: anywhere;
}
.song-head .artist { color: var(--muted); font-size: 18px; margin-top: 4px; }
.plate {
  flex: none; background: var(--accent); color: var(--accent-ink); border-radius: 16px;
  padding: 10px 18px 12px; text-align: center; min-width: 120px;
}
.plate .big { font-family: var(--font-lyrics); font-weight: 700; font-size: 44px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.plate .small { font-size: 14px; font-weight: 700; letter-spacing: .04em; opacity: .9; }
.lyrics {
  font-family: var(--font-lyrics); line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere;
  padding-block: 12px 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.lyrics .ln { min-height: 1.5em; }
.lyrics .chord { color: var(--accent); font-weight: 700; }
.lyrics .sung { line-height: 2.35; }
.lyrics .ch { position: relative; }
.lyrics .ch::before {
  content: attr(data-c); position: absolute; left: 0; top: -1.05em;
  color: var(--accent); font-weight: 700; font-size: .85em; line-height: 1; white-space: nowrap;
}
.lyrics .section {
  font-family: var(--font-body); font-weight: 700; color: var(--muted);
  font-size: .7em; letter-spacing: .08em; text-transform: uppercase; margin-top: .6em; margin-bottom: .5em;
}
.end-space { height: 70vh; display: flex; align-items: flex-start; justify-content: center; color: var(--muted); padding-top: 24px; font-size: 16px; }

.controls {
  position: fixed; z-index: 6; left: 0; right: 0; bottom: 0;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px var(--gutter-r) calc(10px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
  box-shadow: 0 -4px 18px rgba(0,0,0,.08);
}
.controls .row { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.group .lbl { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.group .pair { display: flex; align-items: center; gap: 4px; }
.group .val { min-width: 1.6em; text-align: center; font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.sq:disabled { opacity: .4; }
.sq {
  width: 48px; height: 48px; border-radius: 12px; border: 2px solid var(--edge); background: var(--surface);
  font-weight: 700; font-size: 22px; display: inline-flex; align-items: center; justify-content: center; padding: 0;
}
.sq:active { border-color: var(--accent); }
.sq.aa-small { font-size: 16px; }
.sq.aa-big { font-size: 26px; }
.play {
  width: 76px; height: 76px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink);
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  box-shadow: 0 4px 14px rgba(0,0,0,.2);
}
.play svg { width: 40px; height: 40px; }
@media (max-width: 370px) {
  .sq { width: 42px; height: 42px; }
  .play { width: 64px; height: 64px; }
  .group .val { font-size: 18px; }
}

/* ---------- Editor ---------- */
.form { display: grid; gap: 18px; padding-block: 20px 140px; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 700; font-size: 17px; }
.field .hint { color: var(--muted); font-size: 15px; }
.field input, .field select, .field textarea {
  width: 100%; min-height: 56px; border: 2px solid var(--edge); border-radius: 12px;
  background: var(--surface); padding: 10px 14px; font-size: 20px;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); outline: none; }
.field textarea { min-height: 50vh; font-family: var(--font-lyrics); font-size: 17px; line-height: 1.45; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.preview { font-family: var(--font-lyrics); font-weight: 700; font-size: 28px; color: var(--accent); }
.form-actions { display: flex; flex-wrap: wrap; gap: 12px; }
.form-actions .btn { flex: 1 1 140px; }
.confirm {
  border: 2px solid var(--danger); border-radius: 14px; padding: 14px; display: grid; gap: 12px; background: var(--surface);
}
.confirm p { margin: 0; font-weight: 700; }
.error { color: var(--danger); font-weight: 700; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 20;
  bottom: calc(120px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 12px; font-weight: 700;
  max-width: calc(100% - 32px); text-align: center;
}
.label { font-weight: 700; font-size: 17px; }
.btn.big { min-height: 64px; font-size: 20px; border-radius: 16px; }
.btn:disabled, .sq:disabled { opacity: .4; cursor: default; }
.stepper { display: flex; align-items: center; gap: 12px; }
.stepper .sq { width: 60px; height: 60px; font-size: 28px; background: var(--surface); }
.stepper output { min-width: 4.5em; text-align: center; font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-width: 56px; min-height: 52px; padding: 0 12px; border-radius: 12px; border: 2px solid var(--edge);
  background: var(--surface); font-family: var(--font-lyrics); font-weight: 700; font-size: 20px;
}
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.showas { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.showas .hint { color: var(--muted); font-size: 15px; }
.banner {
  display: flex; gap: 12px; align-items: flex-start; background: var(--accent-soft); color: var(--ink);
  border-radius: 14px; padding: 14px 16px;
}
.banner svg { width: 28px; height: 28px; flex: none; color: var(--accent); }
.banner p { margin: 0; }
.savebar {
  position: fixed; z-index: 6; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding: 12px var(--gutter-r) calc(12px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
}
.savebar .btn { width: 100%; max-width: 760px; margin: 0 auto; display: flex; }
.danger-zone { display: grid; gap: 12px; margin-top: 12px; padding-top: 18px; border-top: 1px solid var(--line); }
.leave { border: 2px solid var(--danger); border-radius: 14px; padding: 14px; margin-top: 14px; display: grid; gap: 12px; background: var(--surface); }
.leave p { margin: 0; font-weight: 700; }
.choices { display: grid; gap: 14px; padding-block: 20px; }
.choice {
  display: flex; align-items: center; gap: 16px; text-align: left; width: 100%;
  background: var(--surface); border: 2px solid var(--edge); border-radius: 18px; padding: 20px; min-height: 110px;
}
.choice:not(:disabled):not(.off):active { border-color: var(--accent); }
.choice > span:last-child { display: grid; gap: 4px; min-width: 0; }
.choice b { font-size: 22px; }
.choice span span { color: var(--muted); font-size: 17px; }
.choice .ico {
  flex: none; width: 64px; height: 64px; border-radius: 16px; background: var(--accent-soft); color: var(--accent);
  display: inline-flex; align-items: center; justify-content: center;
}
.choice .ico svg { width: 34px; height: 34px; }
.choice.off { opacity: .7; }
.choice:disabled { opacity: .6; }
.scan { display: grid; gap: 18px; padding-block: 20px 60px; }
.scan .lead { font-size: 19px; margin: 0; }
.scan-actions { display: grid; gap: 12px; }
.thumbs { display: flex; flex-wrap: wrap; gap: 12px; }
.thumb { position: relative; margin: 0; width: 132px; }
.thumb img { width: 132px; height: 170px; object-fit: cover; border-radius: 12px; border: 2px solid var(--line); display: block; }
.thumb .sq { position: absolute; top: 6px; right: 6px; width: 44px; height: 44px; font-size: 26px; background: var(--surface); }
.thumb .sq.rot { right: auto; left: 6px; }
.thumb .sq.rot svg { width: 24px; height: 24px; }
.thumb figcaption { text-align: center; color: var(--muted); font-size: 15px; margin-top: 4px; }
.reading { display: grid; justify-items: center; gap: 14px; text-align: center; padding: 20px; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; }
.reading p { margin: 0; font-size: 19px; }
.spinner { width: 48px; height: 48px; border-radius: 50%; border: 5px solid var(--accent-soft); border-top-color: var(--accent); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
.tag.check { color: #8a4b00; border-color: #e0a54a; background: #fff3dd; }
:root[data-theme="dark"] .tag.check { color: #ffcf8a; border-color: #8a5a1a; background: #2c2010; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag.check { color: #ffcf8a; border-color: #8a5a1a; background: #2c2010; } }
.update-bar { position: fixed; z-index: 25; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 8px);
  width: min(720px, calc(100% - 24px)); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 14px;
  background: var(--surface); border: 3px solid var(--accent); border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.update-bar p { margin: 0; flex: 1 1 200px; font-size: 18px; }
.update-bar .btn { flex: 0 0 auto; }
.banner.install { display: grid; background: var(--surface); border: 2px solid var(--accent); margin-top: 12px; }
.banner .share-ico svg { width: 22px; height: 22px; vertical-align: -4px; color: var(--accent); }
.banner.warn { display: grid; background: var(--surface); border: 2px solid #e0a54a; }
.banner.warn .btn { white-space: nowrap; padding: 0 14px; }
.count-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 12px 0 8px; }
.count-row .count { margin: 0 4px; }
.btn.filter { min-height: 48px; padding: 0 14px; font-size: 17px; }
.btn.filter.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.check-row { display: flex; align-items: center; gap: 14px; font-size: 19px; font-weight: 700; background: var(--surface); border: 2px solid var(--edge); border-radius: 14px; padding: 14px 16px; cursor: pointer; }
.check-row .hint { display: block; color: var(--muted); font-size: 15px; font-weight: 500; }
.check-row input { width: 30px; height: 30px; accent-color: var(--accent); flex: none; }
.sheet-photos { display: grid; gap: 10px; }
.lyrics .sheet-img { display: block; width: 100%; border-radius: 12px; margin-bottom: 12px; background: #fff; }
.photo-list { display: grid; gap: 10px; }
.photo-list img { width: 100%; border-radius: 12px; border: 2px solid var(--edge); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 14px; background: var(--surface); border: 2px solid var(--edge); border-radius: 16px; padding: 4px; }
.tab { min-height: 52px; border: 0; border-radius: 12px; background: transparent; font-weight: 700; font-size: 19px; }
.tab.on { background: var(--accent); color: var(--accent-ink); }
.song-row > svg { width: 28px; height: 28px; flex: none; color: var(--muted); }
.song-row.added { border-color: var(--accent); }
.add-mark { flex: none; width: 48px; height: 48px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent); }
.add-mark svg { width: 26px; height: 26px; }
.pl-ctx { margin-top: 6px; font-weight: 700; color: var(--accent); font-size: 17px; }
.parts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--muted); font-size: 16px; font-weight: 700; margin-top: 6px; }
.part-chip {
  display: inline-flex; align-items: center; justify-content: center; min-width: 40px; height: 32px; padding: 0 8px;
  border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-family: var(--font-lyrics); font-weight: 700; font-size: 17px;
}
.part-chip.big-chip { min-width: 52px; height: 44px; font-size: 20px; flex: none; }
.song-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.song-actions .btn { flex: 1 1 150px; padding: 0 12px; gap: 6px; white-space: nowrap; }
.song-actions + .tip { margin-top: 10px; }
.chart-row { justify-content: space-around; }
.book-keys .chip { min-width: 58px; }
.charts .tip { margin: 0 0 8px; }
.chart-row { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.chart { margin: 0; width: 130px; text-align: center; }
.chart figcaption { font-family: var(--font-lyrics); font-weight: 700; font-size: 24px; color: var(--accent); }
.chart svg { width: 130px; height: auto; display: block; }
.chart .str, .chart .fret { stroke: var(--muted); stroke-width: 1.5; }
.chart .nut { stroke: var(--ink); stroke-width: 5; }
.chart .dot { fill: var(--ink); }
.chart .fing { fill: var(--bg); font: 700 14px system-ui, sans-serif; }
.chart .open { fill: none; stroke: var(--ink); stroke-width: 2; }
.chart .mute { fill: var(--ink); font: 700 18px system-ui, sans-serif; }
.chart .base { fill: var(--ink); font: 700 14px system-ui, sans-serif; }
.chart.none p { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
.lyrics .part + .part { margin-top: 1em; }
.end-space { flex-direction: column; align-items: stretch; gap: 16px; text-align: center; }
.end-space p { margin: 0; }
.end-space .next { width: 100%; }
.end-space .next svg { width: 26px; height: 26px; }
.arrange, .pl-page { display: grid; gap: 14px; padding-block: 16px 140px; }
.sub { margin: 8px 0 0; font-size: 18px; letter-spacing: .02em; }
.arr-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.arr-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 2px solid var(--edge); border-radius: 16px; padding: 10px 12px; flex-wrap: wrap; }
.arr-name { flex: 1 1 70px; min-width: 0; font-size: 20px; font-weight: 700; display: grid; gap: 2px; overflow-wrap: anywhere; }
.arr-name .a { font-family: var(--font-lyrics); font-weight: 400; color: var(--muted); font-size: 16px; }
.arr-btns { display: flex; gap: 6px; margin-left: auto; }
.pl-song { flex: 1 1 200px; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left; background: transparent; border: 0; padding: 4px 0; }
.pl-song .num { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
.chip.wide { min-width: 0; padding: 0 16px; font-family: var(--font-body); font-size: 18px; }
.parts-ed { display: grid; gap: 14px; }

        (s.artist ? '<span class="a">' + esc(s.artist) + "</span>" : "") + "</span>" +
        '<span class="capo-chip" aria-label="' + esc(capoWords(s)) + '">' + esc(capoLabel(s)) + "</span></button></li>";
    }).join("");
    list.querySelectorAll(".song-row").forEach(function (b) {
      b.addEventListener("click", function () { go({ name: "song", id: b.getAttribute("data-id") }); });
    });
  }

  // ---------- Song ----------
  var cur = null;
  function speedFor(s) { return prefs.speeds[s.id] || prefs.speed; }

  function partsBar(s) {
    var po = playOrder(s);
    if (po.secs.length < 2) return "";
    return '<div class="parts" aria-label="Parts that play">' + (po.custom ? "Plays: " : "Plays as written: ") +
      (po.order.length ? po.order.map(function (x) { return '<span class="part-chip">' + esc(x.short) + "</span>"; }).join("") : "nothing") + "</div>";
  }
  // When a song is opened from a playlist, remember where we are so the end of the song offers the next one.
  function playlistContext() {
    if (!view.pl) return null;
    var pl = findPlaylist(view.pl);
    if (!pl) return null;
    var ids = pl.items.filter(function (id) { return findSong(id); });
    var idx = Math.min(view.idx || 0, ids.length - 1);
    return { pl: pl, ids: ids, idx: idx, next: ids[idx + 1] ? findSong(ids[idx + 1]) : null };
  }
  var plCtx = null;

  function renderSong(s) {
    cur = s;
    plCtx = playlistContext();
    document.title = s.title + " · Dave's Tunes";
    app.innerHTML =
      '<header class="topbar"><button class="btn ghost" id="back" type="button" aria-label="Back to songs">' + ICON.back + "Songs</button>" +
      '<p class="small-title">' + esc(s.title) + "</p>" +
      (songChords(s).length ? '<button class="btn ghost icon" id="show-charts" type="button" aria-label="Chord charts" title="Chord charts">' + ICON.grid + "</button>" : "") +
      '<button class="btn ghost" id="edit" type="button">' + ICON.edit + "Edit</button></header>" +
      '<section class="song-head"><div class="names"><h2>' + esc(s.title) + "</h2>" +
      (s.artist ? '<div class="artist">' + esc(s.artist) + "</div>" : "") +
      (plCtx ? '<div class="pl-ctx">Song ' + (plCtx.idx + 1) + " of " + plCtx.ids.length + " in \u201c" + esc(plCtx.pl.name) + "\u201d</div>" : "") + "</div>" +
      '<div class="plate"><div class="big">' + esc(capoLabel(s)) + '</div><div class="small">' + esc(capoWords(s)) + "</div></div></section>" +
      (s.unverified ? '<div class="banner warn"><p><b>This song is marked for review.</b></p>' +
        '<div class="form-actions"><button class="btn" id="check-now" type="button">' + ICON.edit + "Review it now</button>" +
        (String(s.lyrics || "").trim() ? '<button class="btn" id="mark-checked" type="button">' + ICON.check + "It\u2019s correct</button>" : "") + "</div></div>" : "") +
      partsBar(s) +
      '<div class="song-actions"><button class="btn" id="arrange" type="button">' + ICON.list + "Arrange</button>" +
      '<button class="btn" id="to-pl" type="button">' + ICON.plus + "Add to playlist</button></div>" +
      '<p class="tip">Tap the words to start or stop scrolling. Press and hold a word to put a chord over it.</p>' +
      '<div class="lyrics" id="lyrics">' + songLyricsHtml(s) + "</div>" +
      '<div class="end-space"><p>End of song</p>' +
      (plCtx && plCtx.next ? '<button class="btn primary big next" id="next" type="button">Next song: ' + esc(plCtx.next.title) + " " + ICON.fwd + "</button>" : "") +
      "</div>" +
      '<div class="controls"><div class="row">' +
        '<div class="group"><span class="lbl">Text size</span><div class="pair">' +
          '<button class="sq aa-small" id="fdown" type="button" aria-label="Smaller text">A</button>' +
          '<span class="val" id="fval"></span>' +
          '<button class="sq aa-big" id="fup" type="button" aria-label="Bigger text">A</button></div></div>' +
        '<button class="play" id="play" type="button" aria-label="Start scrolling">' + ICON.play + "</button>" +
        '<div class="group"><span class="lbl">Speed</span><div class="pair">' +
          '<button class="sq" id="sdown" type="button" aria-label="Slower">−</button>' +
          '<span class="val" id="sval"></span>' +
          '<button class="sq" id="sup" type="button" aria-label="Faster">+</button></div></div>' +
      "</div></div>";

    applyFont();
    showSpeed();
    document.getElementById("back").addEventListener("click", goBack);
    document.getElementById("edit").addEventListener("click", function () { go({ name: "edit", id: s.id }); });
    document.getElementById("arrange").addEventListener("click", function () { go({ name: "arrange", id: s.id }); });
    var sc = document.getElementById("show-charts");
    if (sc) sc.addEventListener("click", function () {
      stopScroll();
      openSheet('<p class="sheet-title">Chords in <q>' + esc(s.title) + "</q></p>" + chartsHtml(s) +
        '<button class="btn" type="button" data-close>Close</button>', function () {});
    });
    // A song kept as a photo only (no words typed yet) shows the sheet itself, so it can still be played.
    if (!String(s.lyrics || "").trim()) {
      photosGet(s.id).then(function (blobs) {
        var lyr = document.getElementById("lyrics");
        if (!blobs || !blobs.length || !lyr || cur !== s) return;
        lyr.innerHTML = blobs.map(function (b, i) { return '<img class="sheet-img" alt="Sheet page ' + (i + 1) + '" src="' + URL.createObjectURL(b) + '">'; }).join("");
      });
    }
    var cn = document.getElementById("check-now");
    if (cn) {
      cn.addEventListener("click", function () { go({ name: "edit", id: s.id }); });
      var mc = document.getElementById("mark-checked");
      if (mc) mc.addEventListener("click", function () {
        delete s.unverified; save(KEY, songs); toast("Marked as reviewed");
        var y = window.scrollY; renderSong(s); window.scrollTo(0, y);
      });
    }
    document.getElementById("to-pl").addEventListener("click", function () { openAddToPlaylist(s); });
    var nx = document.getElementById("next");
    if (nx) nx.addEventListener("click", function () {
      go({ name: "song", id: plCtx.ids[plCtx.idx + 1], pl: plCtx.pl.id, idx: plCtx.idx + 1 }, true);
    });
    document.getElementById("play").addEventListener("click", togglePlay);
    var lyr = document.getElementById("lyrics");
    lyr.addEventListener("click", function () {
      if (justPicked) { justPicked = false; return; }  // the long press already handled this touch
      togglePlay();
    });
    lyr.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    lyr.addEventListener("pointerdown", function (e) {
      justPicked = false;
      var w = e.target.closest(".w");
      if (!w) return;
      var x0 = e.clientX, y0 = e.clientY;
      w.classList.add("pressing");
      function cancel() { clearTimeout(timer); w.classList.remove("pressing"); off(); }
      function move(ev) { if (Math.abs(ev.clientX - x0) > 12 || Math.abs(ev.clientY - y0) > 12) cancel(); }
      function off() {
        lyr.removeEventListener("pointermove", move); lyr.removeEventListener("pointerup", cancel);
        lyr.removeEventListener("pointercancel", cancel); window.removeEventListener("scroll", cancel);
      }
      var timer = setTimeout(function () {
        off(); w.classList.remove("pressing"); justPicked = true;
        stopScroll();
        try { if (navigator.vibrate) navigator.vibrate(30); } catch (x) {}
        openPicker(s, w);
      }, 500);
      lyr.addEventListener("pointermove", move); lyr.addEventListener("pointerup", cancel);
      lyr.addEventListener("pointercancel", cancel); window.addEventListener("scroll", cancel, { passive: true });
    });
    document.getElementById("fdown").addEventListener("click", function () { setFont(prefs.font - FONT_STEP); });
    document.getElementById("fup").addEventListener("click", function () { setFont(prefs.font + FONT_STEP); });
    document.getElementById("sdown").addEventListener("click", function () { setSpeed(speedFor(s) - 1); });
    document.getElementById("sup").addEventListener("click", function () { setSpeed(speedFor(s) + 1); });
  }

  // ---------- Arrange a song ----------
  function renderArrange(s) {
    document.title = "Arrange \u00b7 " + s.title;
    var po = playOrder(s);
    var order = po.custom ? po.order : po.secs;
    var rows = order.map(function (x, i) {
      return '<li class="arr-row"><span class="part-chip big-chip">' + esc(x.short) + '</span><span class="arr-name">' + esc(x.label) + "</span>" +
        '<span class="arr-btns"><button class="sq" type="button" data-up="' + i + '" aria-label="Move ' + esc(x.label) + ' earlier"' + (i ? "" : " disabled") + ">\u2191</button>" +
        '<button class="sq" type="button" data-down="' + i + '" aria-label="Move ' + esc(x.label) + ' later"' + (i < order.length - 1 ? "" : " disabled") + ">\u2193</button>" +
        '<button class="sq" type="button" data-off="' + i + '" aria-label="Turn off this ' + esc(x.label) + '">\u00d7</button></span></li>';
    }).join("");
    app.innerHTML =
      '<header class="topbar"><button class="btn ghost" id="back" type="button">' + ICON.back + "Done</button>" +
      '<p class="small-title">Arrange ' + esc(s.title) + "</p></header>" +
      (po.secs.length
        ? '<div class="arrange">' +
            '<h3 class="sub">Plays in this order</h3>' +
            (rows ? '<ul class="arr-list">' + rows + "</ul>" : '<p class="empty">Nothing will play. Add a part below.</p>') +
            '<h3 class="sub">Add a part</h3><p class="hint">Tap a part to add it at the end. Add one twice to play it twice.</p>' +
            '<div class="chips">' + po.secs.map(function (x) {
              return '<button class="chip wide" type="button" data-add="' + esc(x.id) + '">+ ' + esc(x.label) + "</button>";
            }).join("") + "</div>" +
            '<button class="btn" id="reset" type="button">Play the song as written</button>' +
          "</div>"
        : '<div class="arrange"><p class="empty">This song has no parts marked yet. Tap <b>Edit</b> on the song and use the <b>+ Verse</b>, <b>+ Chorus</b> and <b>+ Bridge</b> buttons to mark them.</p></div>');
    document.getElementById("back").addEventListener("click", goBack);
    if (!po.secs.length) return;
    var ids = order.map(function (x) { return x.id; });
    function store(next) {
      var asWritten = next.length && next.length === po.secs.length && next.every(function (id, i) { return id === po.secs[i].id; });
      if (asWritten) delete s.arrangement; else s.arrangement = next;
      save(KEY, songs);
      var y = window.scrollY; renderArrange(s); window.scrollTo(0, y);
    }
    app.querySelector(".arrange").addEventListener("click", function (e) {
      var t = e.target.closest("button"); if (!t) return;
      var n = ids.slice(), i;
      if (t.hasAttribute("data-up")) { i = +t.getAttribute("data-up"); n.splice(i - 1, 0, n.splice(i, 1)[0]); }
      else if (t.hasAttribute("data-down")) { i = +t.getAttribute("data-down"); n.splice(i + 1, 0, n.splice(i, 1)[0]); }
      else if (t.hasAttribute("data-off")) { n.splice(+t.getAttribute("data-off"), 1); }
      else if (t.hasAttribute("data-add")) { n.push(t.getAttribute("data-add")); }
      else if (t.id === "reset") { n = po.secs.map(function (x) { return x.id; }); }
      else return;
      store(n);
    });
  }

  // ---------- Playlists ----------
  function fillPlaylists() {
    var list = document.getElementById("plists");
    document.getElementById("count").textContent = playlists.length + (playlists.length === 1 ? " playlist" : " playlists");
    list.innerHTML = playlists.length ? playlists.map(function (pl) {
      var n = pl.items.filter(function (id) { return findSong(id); }).length;
      return '<li><button class="song-row" type="button" data-pl="' + esc(pl.id) + '"><span class="info"><span class="t">' + esc(pl.name) +
        '</span><span class="a">' + n + (n === 1 ? " song" : " songs") + "</span></span>" + ICON.fwd + "</button></li>";
    }).join("") : '<li class="empty">No playlists yet. Tap <b>New playlist</b> to make one, like \u201cSunday service\u201d.</li>';
    list.querySelectorAll("[data-pl]").forEach(function (b) {
      b.addEventListener("click", function () { go({ name: "playlist", pl: b.getAttribute("data-pl") }); });
    });
    document.getElementById("new-pl").addEventListener("click", function () {
      askName("New playlist", "", "Create", function (name) {
        var pl = { id: newId("p-"), name: name, items: [] };
        playlists.push(pl); savePlaylists();
        go({ name: "playlist", pl: pl.id });
      });
    });
  }

  function renderPlaylist(pl) {
    document.title = pl.name + " \u00b7 Dave's Tunes";
    var items = pl.items.map(function (id, i) { return { s: findSong(id), i: i }; }).filter(function (x) { return x.s; });
    app.innerHTML =
      '<header class="topbar"><button class="btn ghost" id="back" type="button">' + ICON.back + "Playlists</button>" +
      '<p class="small-title">' + esc(pl.name) + "</p>" +
      '<button class="btn ghost" id="rename" type="button">' + ICON.edit + "Rename</button></header>" +
      '<div class="pl-page">' +
        (items.length ? '<button class="btn primary big" id="play-all" type="button">' + ICON.play + "Play from the start</button>" : "") +
        '<ul class="arr-list">' + (items.length ? items.map(function (x, k) {
          var po = playOrder(x.s);
          return '<li class="arr-row"><button class="pl-song" type="button" data-play="' + k + '"><span class="num">' + (k + 1) + "</span>" +
            '<span class="arr-name"><b>' + esc(x.s.title) + "</b>" +
            (po.custom ? '<span class="a">' + po.order.map(function (o) { return esc(o.short); }).join(" \u00b7 ") + "</span>" : "") + "</span>" +
            '<span class="capo-chip">' + esc(capoLabel(x.s)) + "</span></button>" +
            '<span class="arr-btns"><button class="sq" type="button" data-up="' + x.i + '" aria-label="Move earlier"' + (k ? "" : " disabled") + ">\u2191</button>" +
            '<button class="sq" type="button" data-down="' + x.i + '" aria-label="Move later"' + (k < items.length - 1 ? "" : " disabled") + ">\u2193</button>" +
            '<button class="sq" type="button" data-rm="' + x.i + '" aria-label="Take ' + esc(x.s.title) + ' off this playlist">\u00d7</button></span></li>';
        }).join("") : '<li class="empty">This playlist is empty. Tap <b>Add songs</b> to fill it.</li>') + "</ul>" +
        '<button class="btn big" id="add-songs" type="button">' + ICON.plus + "Add songs</button>" +
        '<div class="danger-zone"><button class="btn danger" id="del-pl" type="button">Delete this playlist</button>' +
          '<div class="confirm" id="confirm" hidden><p>Delete the playlist \u201c' + esc(pl.name) + '\u201d? Your songs stay in Dave\u2019s Tunes.</p>' +
          '<div class="form-actions"><button class="btn danger" id="del-yes" type="button">Yes, delete it</button>' +
          '<button class="btn" id="del-no" type="button">Keep it</button></div></div></div>' +
      "</div>";
    document.getElementById("back").addEventListener("click", goBack);
    document.getElementById("rename").addEventListener("click", function () {
      askName("Rename playlist", pl.name, "Save", function (name) { pl.name = name; savePlaylists(); renderPlaylist(pl); });
    });
    var pa = document.getElementById("play-all");
    var ids = items.map(function (x) { return x.s.id; });
    if (pa) pa.addEventListener("click", function () { go({ name: "song", id: ids[0], pl: pl.id, idx: 0 }); });
    document.getElementById("add-songs").addEventListener("click", function () { go({ name: "pl-add", pl: pl.id }); });
    var box = document.getElementById("confirm"), del = document.getElementById("del-pl");
    del.addEventListener("click", function () { box.hidden = false; del.hidden = true; box.scrollIntoView({ block: "center" }); });
    document.getElementById("del-no").addEventListener("click", function () { box.hidden = true; del.hidden = false; });
    document.getElementById("del-yes").addEventListener("click", function () {
      playlists = playlists.filter(function (x) { return x.id !== pl.id; }); savePlaylists();
      toast("Playlist deleted"); goBack();
    });
    app.querySelectorAll("[data-play]").forEach(function (b) {
      b.addEventListener("click", function () { var k = +b.getAttribute("data-play"); go({ name: "song", id: ids[k], pl: pl.id, idx: k }); });
    });
    function move(from, to) { var it = pl.items.splice(from, 1)[0]; pl.items.splice(to, 0, it); savePlaylists(); var y = window.scrollY; renderPlaylist(pl); window.scrollTo(0, y); }
    var real = items.map(function (x) { return x.i; });
    app.querySelectorAll("[data-up]").forEach(function (b) { b.addEventListener("click", function () { var i = +b.getAttribute("data-up"); move(i, real[real.indexOf(i) - 1]); }); });
    app.querySelectorAll("[data-down]").forEach(function (b) { b.addEventListener("click", function () { var i = +b.getAttribute("data-down"); move(i, real[real.indexOf(i) + 1]); }); });
    app.querySelectorAll("[data-rm]").forEach(function (b) {
      b.addEventListener("click", function () { pl.items.splice(+b.getAttribute("data-rm"), 1); savePlaylists(); var y = window.scrollY; renderPlaylist(pl); window.scrollTo(0, y); });
    });
  }

  var plQuery = "";
  function renderPlaylistAdd(pl) {
    document.title = "Add songs \u00b7 " + pl.name;
    app.innerHTML =
      '<header class="topbar"><button class="btn ghost" id="back" type="button">' + ICON.back + "Done</button>" +
      '<p class="small-title">Add to ' + esc(pl.name) + "</p></header>" +
      '<label class="search" for="pq">' + ICON.search + '<input id="pq" type="search" placeholder="Find a song" autocomplete="off" value="' + esc(plQuery) + '"></label>' +
      '<p class="count">Tap a song to add it to the end of the playlist.</p><ul class="songs" id="pl-pick"></ul>';
    document.getElementById("back").addEventListener("click", goBack);
    var pq = document.getElementById("pq");
    function fill() {
      var q = plQuery.trim().toLowerCase();
      var shown = songs.slice().sort(byTitle).filter(function (s) { return !q || (s.title + " " + (s.artist || "")).toLowerCase().indexOf(q) !== -1; });
      var list = document.getElementById("pl-pick");
      list.innerHTML = shown.length ? shown.map(function (s) {
        var n = pl.items.filter(function (id) { return id === s.id; }).length;
        return '<li><button class="song-row' + (n ? " added" : "") + '" type="button" data-id="' + esc(s.id) + '"><span class="info"><span class="t">' + esc(s.title) + "</span>" +
          '<span class="a">' + (n ? (n === 1 ? "In this playlist" : "In this playlist " + n + " times") : esc(s.artist || "")) + "</span></span>" +
          '<span class="add-mark">' + (n ? ICON.check : ICON.plus) + "</span></button></li>";
      }).join("") : '<li class="empty">No songs match \u201c' + esc(plQuery.trim()) + "\u201d.</li>";
      list.querySelectorAll("[data-id]").forEach(function (b) {
        b.addEventListener("click", function () {
          var s = findSong(b.getAttribute("data-id"));
          pl.items.push(s.id); savePlaylists(); toast("Added " + s.title); fill();
        });
      });
    }
    pq.addEventListener("input", function () { plQuery = pq.value; fill(); });
    fill();
  }

  // ---------- Bottom sheets: name a playlist, or add a song to one ----------
  function openSheet(html, onClick) {
    var back = document.getElementById("menu");
    back.querySelector(".sheet").innerHTML = html;
    back.hidden = false;
    function close() { back.hidden = true; back.onclick = null; }
    back.onclick = function (e) {
      if (e.target === back || e.target.closest("[data-close]")) return close();
      onClick(e, close);
    };
    return back;
  }
  function askName(title, value, action, done) {
    var back = openSheet(
      '<p class="sheet-title">' + esc(title) + "</p>" +
      '<form id="name-form" class="name-form"><input id="pl-name" maxlength="60" autocomplete="off" placeholder="Name, like Sunday service" value="' + esc(value) + '">' +
      '<p class="error" id="name-err" hidden>Give the playlist a name.</p>' +
      '<div class="form-actions"><button class="btn primary" type="submit">' + esc(action) + '</button><button class="btn" type="button" data-close>Cancel</button></div></form>',
      function () {});
    var input = document.getElementById("pl-name");
    input.focus();
    document.getElementById("name-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var name = input.value.trim();
      if (!name) { document.getElementById("name-err").hidden = false; return; }
      back.hidden = true; back.onclick = null;
      done(name);
    });
  }
  function openAddToPlaylist(s) {
    stopScroll();
    openSheet(
      '<p class="sheet-title">Add <q>' + esc(s.title) + "</q> to a playlist</p>" +
      (playlists.length ? '<div class="sheet-list">' + playlists.map(function (pl) {
        return '<button class="btn" type="button" data-to="' + esc(pl.id) + '">' + esc(pl.name) + "</button>";
      }).join("") + "</div>" : '<p class="hint">You don\u2019t have any playlists yet.</p>') +
      '<div class="form-actions"><button class="btn primary" type="button" id="sheet-new">' + ICON.plus + "New playlist</button>" +
      '<button class="btn" type="button" data-close>Cancel</button></div>' +
      '<p class="hint">The song plays with its arrangement. Change that with <b>Arrange</b>.</p>',
      function (e, close) {
        var to = e.target.closest("[data-to]");
        if (to) { var pl = findPlaylist(to.getAttribute("data-to")); pl.items.push(s.id); savePlaylists(); close(); toast("Added to " + pl.name); return; }
        if (e.target.closest("#sheet-new")) {
          close();
          askName("New playlist", "", "Create and add", function (name) {
            var pl = { id: newId("p-"), name: name, items: [s.id] };
            playlists.push(pl); savePlaylists(); toast("Added to " + name);
          });
        }
      });
  }

  // ---------- Chord picker (opened by pressing and holding a word) ----------
  var justPicked = false;
  var PICK_CHORDS = ["C", "D", "E", "F", "G", "A", "B", "Am", "Bm", "Dm", "Em", "F#m", "C7", "D7", "E7", "G7", "A7", "B7"];
  function openPicker(s, w) {
    var li = Number(w.getAttribute("data-l")), col = Number(w.getAttribute("data-c")), end = Number(w.getAttribute("data-e"));
    var word = w.textContent, current = chordOnWord(s.lyrics, li, col, end);
    var back = document.getElementById("picker"), input = document.getElementById("pick-input"), err = document.getElementById("pick-error");
    document.getElementById("pick-title").innerHTML = (current ? "Change the chord over " : "Put a chord over ") + "<q>" + esc(word) + "</q>";
    document.getElementById("pick-grid").innerHTML = PICK_CHORDS.map(function (c) {
      return '<button class="chip' + (c === current ? " on" : "") + '" type="button" data-pick="' + c + '">' + c + "</button>";
    }).join("");
    input.value = ""; err.hidden = true;
    document.getElementById("pick-remove").hidden = !current;
    back.hidden = false;
    function close() {
      back.hidden = true;
      back.onclick = null;
      setTimeout(function () { justPicked = false; }, 400);
    }
    function apply(chord) {
      var y = window.scrollY;
      s.lyrics = setChordOnWord(s.lyrics, li, col, end, chord);
      delete s.sample;
      save(KEY, songs);
      close();
      document.getElementById("lyrics").innerHTML = songLyricsHtml(s);
      window.scrollTo(0, y);
      toast(chord ? chord + " added over \u201c" + word + "\u201d" : "Chord removed");

        if (view.name !== "scan") return;
        reading.hidden = true; actions.hidden = false;
        if (e && e.code === "cancelled") return;
        if (e && ["not_granted", "sampling_disabled", "images_unavailable"].indexOf(e.code) !== -1) scanState = "off";
        err.textContent = (e && SCAN_ERRORS[e.code]) || "Something went wrong reading the sheet. Tap Read the sheet to try again.";
        err.hidden = false;
      });
  }

  // ---------- Add / edit ----------
  var draft = null;
  var COMMON_CHORDS = ["C", "D", "E", "F", "G", "A", "B", "Am", "Dm", "Em"];
  function goBack() { history.length > 1 ? history.back() : go({ name: "list" }, true); }

  function renderEdit(s, fromDraft) {
    var isNew = !s;
    s = s || fromDraft || { title: "", artist: "", capo: 0, chord: "", lyrics: "" };
    document.title = (isNew ? "Add song" : "Edit song") + " · Dave's Tunes";
    var parts = textToParts(s.lyrics);
    var start = JSON.stringify([s.title, s.artist, Number(s.capo) || 0, s.chord, partsToText(parts)]);
    var needsCheck = !!((fromDraft && fromDraft.scanned) || s.unverified);
    var chips = COMMON_CHORDS.map(function (c) {
      return '<button class="chip" type="button" data-chord="' + c + '">' + c + "</button>";
    }).join("");
    app.innerHTML =
      '<header class="topbar"><button class="btn ghost" id="cancel" type="button">' + ICON.back + "Cancel</button>" +
      '<p class="small-title">' + (isNew ? "Add a song" : "Edit song") + "</p></header>" +
      '<div class="leave" id="leave" hidden><p>Leave without saving? Your changes will be lost.</p>' +
        '<div class="form-actions"><button class="btn danger" id="leave-yes" type="button">Leave</button>' +
        '<button class="btn primary" id="leave-no" type="button">Keep editing</button></div></div>' +
      '<form class="form" id="form" novalidate>' +
        (fromDraft && fromDraft.scanned
          ? '<div class="banner">' + ICON.check + "<p><b>Here’s what was read from the sheet.</b> Check it against the paper now, or just tap <b>Save, review later</b> and move on to the next sheet." +
            (fromDraft.ocr ? " Handwriting and chords often come out wrong, so look closely when you check." : "") + "</p></div>"
          : "") +
        (needsCheck ? '<div class="sheet-photos"><button class="btn" id="show-photos" type="button" hidden>' + ICON.camera + "Show the sheet photo</button>" +
          '<div class="photo-list" id="photo-list" hidden></div></div>' : "") +
        '<div class="field"><label for="f-title">Song title</label><input id="f-title" required autocapitalize="words" value="' + esc(s.title) + '"></div>' +
        '<div class="field"><label for="f-artist">Who sings it <span class="hint">(optional)</span></label><input id="f-artist" autocapitalize="words" value="' + esc(s.artist) + '"></div>' +
        '<div class="field"><span class="label" id="capo-lbl">Capo fret</span>' +
          '<div class="stepper" role="group" aria-labelledby="capo-lbl">' +
            '<button class="sq" id="capo-down" type="button" aria-label="Capo lower">−</button>' +
            '<output id="f-capo" aria-live="polite"></output>' +
            '<button class="sq" id="capo-up" type="button" aria-label="Capo higher">+</button></div></div>' +
        '<div class="field"><label for="f-chord">Starting chord</label>' +
          '<div class="chips" id="chips">' + chips + "</div>" +
          '<input id="f-chord" autocapitalize="characters" autocomplete="off" placeholder="Tap one above or type it, like C or F#m" value="' + esc(s.chord) + '"></div>' +
        '<div class="showas"><span class="hint">Shows at the top of the song as</span><span class="preview" id="f-preview"></span></div>' +
        '<div class="field"><span class="label">Words and chords</span>' +
          '<span class="hint">Each part of the song has its own box, with chords on their own line above the words. ' +
          "To make a new part, select the lines that belong in it and tap <b>Move to a new part</b>.</span>" +
          '<div class="parts-ed" id="parts-ed"></div>' +
          '<button class="btn" id="add-part" type="button">' + ICON.plus + "Add a part at the end</button></div>" +
        '<p class="error" id="f-error" role="alert" hidden></p>' +
        (isNew ? "" :
          '<div class="danger-zone"><button class="btn danger" id="del" type="button">Delete this song</button>' +
          '<div class="confirm" id="confirm" hidden><p>Delete “' + esc(s.title) + '” for good?</p>' +
          '<div class="form-actions"><button class="btn danger" id="del-yes" type="button">Yes, delete it</button>' +
          '<button class="btn" id="del-no" type="button">Keep it</button></div></div></div>') +
        '<label class="check-row" for="f-review"><input type="checkbox" id="f-review"' + (needsCheck ? " checked" : "") + '><span>Needs review<span class="hint">Tick it to come back and check this song later.</span></span></label>' +
        '<div class="savebar"><button class="btn primary big" id="save-btn" type="submit">' + ICON.check + "Save song</button></div>" +
      "</form>";

    var capoVal = Number(s.capo) || 0;
    var capoOut = document.getElementById("f-capo"), chord = document.getElementById("f-chord");
    var reviewBox = document.getElementById("f-review"), saveBtn = document.getElementById("save-btn");
    function saveLabel() {
      saveBtn.innerHTML = ICON.check + (reviewBox.checked ? "Save, review later" : "Save song");
    }
    reviewBox.addEventListener("change", saveLabel);
    saveLabel();
    // Show the photo(s) the song was scanned from, to check the words against.
    if (needsCheck) {
      var got = fromDraft && fromDraft.photos ? Promise.resolve(fromDraft.photos) : photosGet(s.id);
      got.then(function (blobs) {
        if (!blobs || !blobs.length || !document.getElementById("show-photos")) return;
        var btn = document.getElementById("show-photos"), list = document.getElementById("photo-list");
        btn.hidden = false;
        list.innerHTML = blobs.map(function (b, i) { return '<img alt="Sheet page ' + (i + 1) + '" src="' + URL.createObjectURL(b) + '">'; }).join("");
        btn.addEventListener("click", function () {
          list.hidden = !list.hidden;
          btn.innerHTML = ICON.camera + (list.hidden ? "Show the sheet photo" : "Hide the sheet photo");
        });
      });
    }
    function current() {
      return [document.getElementById("f-title").value.trim(), document.getElementById("f-artist").value.trim(),
        capoVal, chord.value.trim(), partsToText(parts)];
    }
    function sync() {
      capoOut.textContent = capoVal === 0 ? "No capo" : capoVal;
      document.getElementById("capo-down").disabled = capoVal <= 0;
      document.getElementById("capo-up").disabled = capoVal >= 12;
      document.getElementById("f-preview").textContent = capoLabel({ capo: capoVal, chord: chord.value.trim() || "?" });
      app.querySelectorAll(".chip").forEach(function (c) { c.classList.toggle("on", c.getAttribute("data-chord") === chord.value.trim()); });
    }
    document.getElementById("capo-down").addEventListener("click", function () { capoVal = Math.max(0, capoVal - 1); sync(); });
    document.getElementById("capo-up").addEventListener("click", function () { capoVal = Math.min(12, capoVal + 1); sync(); });
    document.getElementById("chips").addEventListener("click", function (e) {
      var c = e.target.closest(".chip"); if (!c) return;
      chord.value = c.getAttribute("data-chord"); sync();
    });
    chord.addEventListener("input", sync);
    // Part-by-part editing: every part is its own box, and selected lines can be moved into a new part.
    var partsEd = document.getElementById("parts-ed"), sel = {};
    function drawParts(focusIdx) {
      partsEd.innerHTML = parts.map(function (pt, i) {
        var gaps = /\S[ \t]*\n[ \t]*\n[ \t]*\S/.test(pt.text);
        return '<section class="part-ed" data-i="' + i + '">' +
          '<div class="part-head"><button class="btn part-name" type="button" data-act="name" aria-label="What this part is: ' + esc(pt.name || "no name") + '">' +
            esc(pt.name || "No name") + ' <span aria-hidden="true">\u25be</span></button>' +
            (i > 0 ? '<button class="btn ghost join" type="button" data-act="join">Join with part above</button>' : "") + "</div>" +
          '<textarea class="part-text" spellcheck="false" data-i="' + i + '" aria-label="Words for ' + esc(pt.name || "this part") + '">' + esc(pt.text) + "</textarea>" +
          '<div class="part-tools"><button class="btn" type="button" data-act="split">' + ICON.plus + "Move to a new part</button>" +
            (gaps ? '<button class="btn" type="button" data-act="gaps">Split at the gaps</button>' : "") + "</div></section>";
      }).join("");
      partsEd.querySelectorAll(".part-text").forEach(fitBox);
      if (focusIdx != null) {
        var box = partsEd.querySelector('.part-ed[data-i="' + focusIdx + '"]');
        if (box) box.scrollIntoView({ block: "center" });
      }
    }
    function fitBox(t) { t.style.height = "auto"; t.style.height = Math.max(120, t.scrollHeight + 4) + "px"; }
    function remember(t) { sel[t.getAttribute("data-i")] = [t.selectionStart, t.selectionEnd]; }
    partsEd.addEventListener("input", function (e) {
      var t = e.target.closest(".part-text"); if (!t) return;
      parts[Number(t.getAttribute("data-i"))].text = t.value; fitBox(t); remember(t);
    });
    ["select", "keyup", "pointerup", "touchend", "focusout"].forEach(function (ev) {
      partsEd.addEventListener(ev, function (e) { var t = e.target.closest && e.target.closest(".part-text"); if (t) remember(t); });
    });
    document.addEventListener("selectionchange", function () {
      var t = document.activeElement; if (t && t.classList && t.classList.contains("part-text")) remember(t);
    });
    // Keep the text selection alive while a part button is pressed.
    partsEd.addEventListener("pointerdown", function (e) { if (e.target.closest("[data-act=split]")) e.preventDefault(); });
    partsEd.addEventListener("click", function (e) {
      var b = e.target.closest("[data-act]"); if (!b) return;
      var i = Number(b.closest(".part-ed").getAttribute("data-i")), pt = parts[i], act = b.getAttribute("data-act");
      if (act === "name") return pickPartName(i);
      if (act === "join") {
        var above = parts[i - 1];
        above.text = trimBlank(above.text) + (above.text.trim() && pt.text.trim() ? "\n\n" : "") + trimBlank(pt.text);
        parts.splice(i, 1); renumberVerses(parts); drawParts(i - 1); toast("Joined with the part above"); return;
      }
      if (act === "gaps") {
        var chunks = pt.text.split(/\n[ \t]*\n+/).map(trimBlank).filter(function (c) { return c.trim(); });
        var made = chunks.map(function (c, k) { return { name: k === 0 ? pt.name : nextKind(pt.name), text: c }; });
        parts.splice.apply(parts, [i, 1].concat(made)); renumberVerses(parts); drawParts(i);
        toast("Split into " + made.length + " parts. Tap a name to change what it is."); return;
      }
      if (act === "split") {
        var t = partsEd.querySelector('.part-text[data-i="' + i + '"]'), r = sel[i] || [t.selectionStart, t.selectionEnd];
        var text = pt.text, a = Math.min(r[0], r[1]), z = Math.max(r[0], r[1]);
        // Widen the selection to whole lines; with nothing selected, move from the cursor's line to the end.
        var ls = text.lastIndexOf("\n", a - 1) + 1, le;
        if (z > a) { if (text.charAt(z - 1) === "\n") z--; le = text.indexOf("\n", z); if (le === -1) le = text.length; }
        else le = text.length;
        var before = trimBlank(text.slice(0, ls)), mid = trimBlank(text.slice(ls, le)), after = trimBlank(text.slice(le));
        if (!mid.trim()) { toast("Select the lines for the new part first"); return; }
        var out = [], target;
        if (before.trim()) out.push({ name: pt.name, text: before });
        target = out.length;
        out.push({ name: before.trim() ? (pt.name && /^chorus/i.test(pt.name) ? "Verse" : "Chorus") : pt.name, text: mid });
        if (after.trim()) out.push({ name: nextKind(pt.name), text: after });
        parts.splice.apply(parts, [i, 1].concat(out)); renumberVerses(parts); drawParts(i + target);
        pickPartName(i + target);
      }
    });
    document.getElementById("add-part").addEventListener("click", function () {
      parts.push({ name: "Verse", text: "" }); renumberVerses(parts); drawParts(parts.length - 1);
      pickPartName(parts.length - 1);
    });
    function pickPartName(i) {
      var kinds = ["Verse", "Chorus", "Bridge", "Intro", "Outro", "Tag", "Ending"];
      var curKind = (parts[i].name.match(/^[A-Za-z]+/) || [""])[0].toLowerCase();
      openSheet('<p class="sheet-title">What is this part?</p>' +
        '<p class="tip">' + esc(firstLine(parts[i].text)) + "</p>" +
        '<div class="sheet-list kinds">' + kinds.map(function (k) {
          return '<button class="btn' + (k.toLowerCase() === curKind ? " primary" : "") + '" type="button" data-kind="' + k + '">' + k + "</button>";
        }).join("") + (i === 0 ? '<button class="btn" type="button" data-kind="">No name</button>' : "") + "</div>" +
        '<button class="btn" type="button" data-close>Cancel</button>',
        function (e, close) {
          var b = e.target.closest("[data-kind]"); if (!b) return;
          parts[i].name = b.getAttribute("data-kind"); renumberVerses(parts); close(); drawParts(i);
        });
    }
    drawParts();
    sync();

    var leave = document.getElementById("leave");
    document.getElementById("cancel").addEventListener("click", function () {
      var changed = JSON.stringify(current()) !== start || reviewBox.checked !== needsCheck || (fromDraft && fromDraft.scanned);
      if (!changed) return goBack();
      leave.hidden = false; window.scrollTo(0, 0);
    });
    document.getElementById("leave-yes").addEventListener("click", function () { draft = null; goBack(); });
    document.getElementById("leave-no").addEventListener("click", function () { leave.hidden = true; });

    document.getElementById("form").addEventListener("submit", function (e) {
      e.preventDefault();
      var v = current(), err = document.getElementById("f-error");
      if (!v[0] && reviewBox.checked) {
        v[0] = "Scanned song " + new Date().toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " " + (songs.filter(function (x) { return x.unverified; }).length + 1);
      }
      if (!v[0]) {
        err.textContent = "Give the song a title so you can find it later."; err.hidden = false;
        document.getElementById("f-title").focus(); return;
      }
      var data = { title: v[0], artist: v[1], capo: v[2], chord: v[3], lyrics: v[4] };
      var later = reviewBox.checked;
      var id;
      if (isNew) {
        id = "u-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        data.id = id; songs.push(data);
      } else {
        id = view.id;
        var existing = findSong(id);
        for (var k in data) existing[k] = data[k];
        delete existing.sample;
      }
      var saved = findSong(id);
      if (later) saved.unverified = true; else delete saved.unverified;
      save(KEY, songs);
      if (isNew && fromDraft && fromDraft.photos && fromDraft.photos.length) {
        Promise.all(fromDraft.photos.map(shrinkPhoto)).then(function (small) { photosPut(id, small); });
      }
      var wasScan = isNew && fromDraft && fromDraft.scanned;
      draft = null;
      if (wasScan && later && scanState !== "off") {
        // Straight on to the next sheet: snap them all now, check the words later.
        lastSaved = data.title; photos = [];
        return go({ name: "scan" }, true);
      }
      toast(isNew ? "Song added" : later ? "Saved. It\u2019s marked for review." : "Song saved");
      if (isNew) go({ name: "song", id: id }, true);
      else history.back();  // return to the song page it was opened from
    });
    if (!isNew) {
      var box = document.getElementById("confirm"), del = document.getElementById("del");
      del.addEventListener("click", function () { box.hidden = false; del.hidden = true; box.scrollIntoView({ block: "center" }); });
      document.getElementById("del-no").addEventListener("click", function () { box.hidden = true; del.hidden = false; });
      document.getElementById("del-yes").addEventListener("click", function () {
        songs = songs.filter(function (x) { return x.id !== view.id; });
        playlists.forEach(function (pl) { pl.items = pl.items.filter(function (id) { return id !== view.id; }); });
        photosDel(view.id);
        savePlaylists();
        delete prefs.speeds[view.id]; save(PREFS, prefs);
        save(KEY, songs);
        toast("Song deleted");
        go({ name: "list" }, true);
      });
    }
  }

  // ---------- Start ----------
  try { history.replaceState(view, ""); } catch (e) {}
  render();

  // Offline support when hosted as an installed app (not available inside every viewer, so failures are ignored)
  // When a newer version has downloaded, a banner offers to switch to it. Songs, playlists and photos
  // live in the browser's storage, not in the app files, so updating never touches them.
  try {
    if ("serviceWorker" in navigator && window.isSecureContext) {
      var updating = false;
      navigator.serviceWorker.addEventListener("controllerchange", function () { if (updating) location.reload(); });
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        function ready() { if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg); }
        ready();
        reg.addEventListener("updatefound", function () {
          var w = reg.installing; if (!w) return;
          w.addEventListener("statechange", function () { if (w.state === "installed") ready(); });
        });
        // An installed app is often just resumed rather than reopened, so look for updates whenever it comes back.
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") reg.update().catch(function () {});
        });
      }).catch(function () {});
      function showUpdate(reg) {
        if (document.getElementById("update-bar")) return;
        var bar = document.createElement("div");
        bar.id = "update-bar"; bar.className = "update-bar"; bar.setAttribute("role", "status");
        bar.innerHTML = "<p><b>A new version is ready.</b> Your songs stay as they are.</p>" +
          '<button class="btn primary" id="update-now" type="button">Update now</button>';
        document.body.appendChild(bar);
        document.getElementById("update-now").addEventListener("click", function () {
          updating = true; this.disabled = true; this.textContent = "Updating\u2026";
          if (reg.waiting) reg.waiting.postMessage("update"); else location.reload();
          setTimeout(function () { location.reload(); }, 4000);
        });
      }
    }
  } catch (e) {}
})();
</script>
