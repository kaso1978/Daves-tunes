<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dave's Tunes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0a6b55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dave's Tunes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@400;700&family=Zilla+Slab:wght@600;700&display=swap">
<style>
/* Layout: one column songbook. List view, then a song "stage" with a fixed control bar at the bottom. Big targets throughout. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --ink: #16201d;
  --muted: #56635e;
  --line: #d6ddda;
  --edge: #8fa39b;
  --accent: #0a6b55;
  --accent-ink: #ffffff;
  --accent-soft: #e0efe9;
  --danger: #b42318;
  --font-display: "Zilla Slab", Georgia, "Times New Roman", serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-lyrics: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1413; --surface: #171e1c; --ink: #edf3f0; --muted: #9db0a8; --line: #2a3532; --edge: #5f7770;
    --accent: #45c79f; --accent-ink: #062219; --accent-soft: #163029; --danger: #ff7b6e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1413; --surface: #171e1c; --ink: #edf3f0; --muted: #9db0a8; --line: #2a3532; --edge: #5f7770;
  --accent: #45c79f; --accent-ink: #062219; --accent-soft: #163029; --danger: #ff7b6e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 18px; line-height: 1.45;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; }

/* ---------- Buttons ---------- */
.btn {
  min-height: 56px; padding: 0 20px; border-radius: 14px; border: 2px solid var(--edge);
  background: var(--surface); font-weight: 700; font-size: 18px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); border-color: currentColor; background: transparent; }
.btn.ghost { min-height: 52px; padding: 0 14px; }
.topbar .btn { flex: none; }
.btn svg { width: 24px; height: 24px; flex: none; }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); display: flex; align-items: center; gap: 12px;
  padding-block: 12px; border-bottom: 1px solid var(--line);
}
.topbar h1 {
  font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.1;
  margin: 0; flex: 1; min-width: 0; text-wrap: balance;
}
.topbar .small-title {
  font-family: var(--font-display); font-weight: 600; font-size: 22px; margin: 0;
  flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ---------- List view ---------- */
.search {
  margin-top: 16px; display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 2px solid var(--edge); border-radius: 16px; padding: 0 16px;
}
.search:focus-within { border-color: var(--accent); }
.search svg { width: 26px; height: 26px; color: var(--muted); flex: none; }
.search input {
  flex: 1; min-width: 0; border: 0; background: transparent; font-size: 20px; min-height: 60px; outline: none;
}
.count { color: var(--muted); font-size: 16px; margin: 16px 4px 8px; }
.songs { list-style: none; margin: 0 0 120px; padding: 0; display: grid; gap: 10px; }
.song-row {
  width: 100%; text-align: left; display: flex; align-items: center; gap: 14px;
  background: var(--surface); border: 2px solid var(--edge); border-radius: 16px;
  padding: 14px 16px; min-height: 76px;
}
.song-row:active { border-color: var(--accent); }
.song-row .info { flex: 1; min-width: 0; }
.song-row .t { font-weight: 700; font-size: 21px; line-height: 1.2; display: block; overflow-wrap: anywhere; }
.song-row .a { color: var(--muted); font-size: 16px; display: block; }
.tag {
  display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin-left: 6px;
  vertical-align: 2px;
}
.capo-chip {
  flex: none; font-family: var(--font-lyrics); font-weight: 700; font-size: 22px;
  background: var(--accent-soft); color: var(--accent); border-radius: 12px; padding: 8px 12px;
  font-variant-numeric: tabular-nums;
}
.empty { text-align: center; color: var(--muted); padding: 40px 12px; font-size: 19px; }
.fab {
  position: fixed; z-index: 6;
  right: calc(var(--gutter-r) + 4px); bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  min-height: 64px; padding: 0 24px; border-radius: 32px; font-size: 20px;
  box-shadow: 0 6px 20px rgba(0,0,0,.18);
}

/* ---------- Song view ---------- */
.song-head { padding-block: 20px 8px; display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.song-head .names { flex: 1 1 260px; min-width: 0; }
.song-head h2 {
  font-family: var(--font-display); font-weight: 700; font-size: 36px; line-height: 1.1; margin: 0;
  text-wrap: balance; overflow-wrap: anywhere;
}
.song-head .artist { color: var(--muted); font-size: 18px; margin-top: 4px; }
.plate {
  flex: none; background: var(--accent); color: var(--accent-ink); border-radius: 16px;
  padding: 10px 18px 12px; text-align: center; min-width: 120px;
}
.plate .big { font-family: var(--font-lyrics); font-weight: 700; font-size: 44px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.plate .small { font-size: 14px; font-weight: 700; letter-spacing: .04em; opacity: .9; }
.lyrics {
  font-family: var(--font-lyrics); line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere;
  padding-block: 12px 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.lyrics .ln { min-height: 1.5em; }
.lyrics .chord { color: var(--accent); font-weight: 700; }
.lyrics .sung { line-height: 2.35; }
.lyrics .ch { position: relative; }
.lyrics .ch::before {
  content: attr(data-c); position: absolute; left: 0; top: -1.05em;
  color: var(--accent); font-weight: 700; font-size: .85em; line-height: 1; white-space: nowrap;
}
.lyrics .section {
  font-family: var(--font-body); font-weight: 700; color: var(--muted);
  font-size: .7em; letter-spacing: .08em; text-transform: uppercase; margin-top: .6em; margin-bottom: .5em;
}
.end-space { height: 70vh; display: flex; align-items: flex-start; justify-content: center; color: var(--muted); padding-top: 24px; font-size: 16px; }

.controls {
  position: fixed; z-index: 6; left: 0; right: 0; bottom: 0;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px var(--gutter-r) calc(10px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
  box-shadow: 0 -4px 18px rgba(0,0,0,.08);
}
.controls .row { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.group .lbl { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.group .pair { display: flex; align-items: center; gap: 4px; }
.group .val { min-width: 1.6em; text-align: center; font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.sq:disabled { opacity: .4; }
.sq {
  width: 48px; height: 48px; border-radius: 12px; border: 2px solid var(--edge); background: var(--surface);
  font-weight: 700; font-size: 22px; display: inline-flex; align-items: center; justify-content: center; padding: 0;
}
.sq:active { border-color: var(--accent); }
.sq.aa-small { font-size: 16px; }
.sq.aa-big { font-size: 26px; }
.play {
  width: 76px; height: 76px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink);
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  box-shadow: 0 4px 14px rgba(0,0,0,.2);
}
.play svg { width: 40px; height: 40px; }
@media (max-width: 370px) {
  .sq { width: 42px; height: 42px; }
  .play { width: 64px; height: 64px; }
  .group .val { font-size: 18px; }
}

/* ---------- Editor ---------- */
.form { display: grid; gap: 18px; padding-block: 20px 140px; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 700; font-size: 17px; }
.field .hint { color: var(--muted); font-size: 15px; }
.field input, .field select, .field textarea {
  width: 100%; min-height: 56px; border: 2px solid var(--edge); border-radius: 12px;
  background: var(--surface); padding: 10px 14px; font-size: 20px;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); outline: none; }
.field textarea { min-height: 50vh; font-family: var(--font-lyrics); font-size: 17px; line-height: 1.45; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.preview { font-family: var(--font-lyrics); font-weight: 700; font-size: 28px; color: var(--accent); }
.form-actions { display: flex; flex-wrap: wrap; gap: 12px; }
.form-actions .btn { flex: 1 1 140px; }
.confirm {
  border: 2px solid var(--danger); border-radius: 14px; padding: 14px; display: grid; gap: 12px; background: var(--surface);
}
.confirm p { margin: 0; font-weight: 700; }
.error { color: var(--danger); font-weight: 700; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 20;
  bottom: calc(120px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 12px; font-weight: 700;
  max-width: calc(100% - 32px); text-align: center;
}
.label { font-weight: 700; font-size: 17px; }
.btn.big { min-height: 64px; font-size: 20px; border-radius: 16px; }
.btn:disabled, .sq:disabled { opacity: .4; cursor: default; }
.stepper { display: flex; align-items: center; gap: 12px; }
.stepper .sq { width: 60px; height: 60px; font-size: 28px; background: var(--surface); }
.stepper output { min-width: 4.5em; text-align: center; font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-width: 56px; min-height: 52px; padding: 0 12px; border-radius: 12px; border: 2px solid var(--edge);
  background: var(--surface); font-family: var(--font-lyrics); font-weight: 700; font-size: 20px;
}
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.showas { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.showas .hint { color: var(--muted); font-size: 15px; }
.banner {
  display: flex; gap: 12px; align-items: flex-start; background: var(--accent-soft); color: var(--ink);
  border-radius: 14px; padding: 14px 16px;
}
.banner svg { width: 28px; height: 28px; flex: none; color: var(--accent); }
.banner p { margin: 0; }
.savebar {
  position: fixed; z-index: 6; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding: 12px var(--gutter-r) calc(12px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
}
.savebar .btn { width: 100%; max-width: 760px; margin: 0 auto; display: flex; }
.danger-zone { display: grid; gap: 12px; margin-top: 12px; padding-top: 18px; border-top: 1px solid var(--line); }
.leave { border: 2px solid var(--danger); border-radius: 14px; padding: 14px; margin-top: 14px; display: grid; gap: 12px; background: var(--surface); }
.leave p { margin: 0; font-weight: 700; }
.choices { display: grid; gap: 14px; padding-block: 20px; }
.choice {
  display: flex; align-items: center; gap: 16px; text-align: left; width: 100%;
  background: var(--surface); border: 2px solid var(--edge); border-radius: 18px; padding: 20px; min-height: 110px;
}
.choice:not(:disabled):not(.off):active { border-color: var(--accent); }
.choice > span:last-child { display: grid; gap: 4px; min-width: 0; }
.choice b { font-size: 22px; }
.choice span span { color: var(--muted); font-size: 17px; }
.choice .ico {
  flex: none; width: 64px; height: 64px; border-radius: 16px; background: var(--accent-soft); color: var(--accent);
  display: inline-flex; align-items: center; justify-content: center;
}
.choice .ico svg { width: 34px; height: 34px; }
.choice.off { opacity: .7; }
.choice:disabled { opacity: .6; }
.scan { display: grid; gap: 18px; padding-block: 20px 60px; }
.scan .lead { font-size: 19px; margin: 0; }
.scan-actions { display: grid; gap: 12px; }
.thumbs { display: flex; flex-wrap: wrap; gap: 12px; }
.thumb { position: relative; margin: 0; width: 132px; }
.thumb img { width: 132px; height: 170px; object-fit: cover; border-radius: 12px; border: 2px solid var(--line); display: block; }
.thumb .sq { position: absolute; top: 6px; right: 6px; width: 44px; height: 44px; font-size: 26px; background: var(--surface); }
.thumb .sq.rot { right: auto; left: 6px; }
.thumb .sq.rot svg { width: 24px; height: 24px; }
.thumb figcaption { text-align: center; color: var(--muted); font-size: 15px; margin-top: 4px; }
.reading { display: grid; justify-items: center; gap: 14px; text-align: center; padding: 20px; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; }
.reading p { margin: 0; font-size: 19px; }
.spinner { width: 48px; height: 48px; border-radius: 50%; border: 5px solid var(--accent-soft); border-top-color: var(--accent); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
.lyrics { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.lyrics .w { border-radius: 6px; }
.lyrics .w.pressing { background: var(--accent-soft); box-shadow: 0 0 0 4px var(--accent-soft); }
.tip { color: var(--muted); font-size: 16px; margin: 4px 0 0; }
.sheet-back { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 760px; background: var(--surface); border-radius: 22px 22px 0 0; display: grid; gap: 14px;
  padding: 18px var(--gutter-r) calc(18px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
  max-height: 92vh; overflow-y: auto;
}
.sheet-title { margin: 0; font-size: 20px; font-weight: 700; }
.sheet-title q { font-family: var(--font-lyrics); color: var(--accent); }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.pick-grid .chip { min-height: 58px; font-size: 22px; }
.pick-other { display: flex; gap: 10px; }
.pick-other input {
  flex: 1; min-width: 0; min-height: 56px; border: 2px solid var(--edge); border-radius: 12px;
  background: var(--bg); padding: 0 14px; font-size: 20px; font-family: var(--font-lyrics);
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>
<div class="sheet-back" id="picker" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pick-title">
    <p class="sheet-title" id="pick-title"></p>
    <div class="pick-grid" id="pick-grid"></div>
    <div class="pick-other">
      <input id="pick-input" autocapitalize="characters" autocomplete="off" placeholder="Other, like Bb" aria-label="Another chord">
      <button class="btn primary" id="pick-add" type="button">Add</button>
    </div>
    <p class="error" id="pick-error" hidden></p>
    <div class="form-actions">
      <button class="btn danger" id="pick-remove" type="button">Remove chord</button>
      <button class="btn" id="pick-cancel" type="button">Cancel</button>
    </div>
  </div>
</div>

    window.claude.use("sample").then(function (s) {
      if (!s) throw 0;
      return s.limits().then(function (lim) {
        if (!lim || !lim.images) throw 0;
        scanner = s; maxPhotos = Math.max(1, Math.min(4, lim.images.maxCount || 1)); scanState = "ready";
      });
    }).catch(function () { scanState = "off"; })
      .then(function () { if (view.name === "add" || view.name === "scan") render(); });
  })();

  var SCAN_PROMPT = [
    "These photos show one song sheet from a guitar player's songbook. It may be printed or handwritten, and may run over several pages.",
    "Copy it out exactly. Reply with only a JSON object like:",
    '{"title": "Red River Valley", "artist": "", "capo": 1, "chord": "C", "lyrics": "[Verse 1]\\nC                         G\\nFrom this valley they say you are going\\n..."}',
    "Rules:",
    "- The player writes the capo and starting chord together like \"1-C\" (capo on fret 1, start on C) or \"Capo 3\". capo is a whole number 0 to 12; use 0 if no capo is shown.",
    "- chord is the starting chord. If none is marked, use the first chord in the song, or \"\" if there are no chords.",
    "- artist is \"\" unless the sheet names who sings or wrote it.",
    "- In lyrics keep every line break and the blank lines between verses.",
    "- Where chords are written above the words, put them on their own line straight above that lyric line, padded with spaces so each chord sits over the letter it is written above.",
    "- If the sheet labels parts (Verse, Chorus, Bridge), write them as [Verse 1], [Chorus] and so on, on their own line.",
    "- If a word can't be read, write [?] in its place. Don't add or fix anything that isn't on the sheet."
  ].join("\n");

  function renderAdd() {
    document.title = "Add song · Dave's Tunes";
    var scanCard =
      scanState === "off"
        ? '<div class="choice off"><span class="ico">' + ICON.camera + '</span><span><b>Scan a paper sheet</b>' +
          "<span>Photo reading isn’t available on this device. Type the song in instead.</span></span></div>"
        : '<button class="choice" id="go-scan" type="button"' + (scanState === "checking" ? " disabled" : "") + '>' +
          '<span class="ico">' + ICON.camera + "</span><span><b>Scan a paper sheet</b>" +
          "<span>" + (scanState === "checking" ? "Getting the camera ready…" : "Take a photo and the words fill in for you to check.") + "</span></span></button>";
    app.innerHTML =
      '<header class="topbar"><button class="btn ghost" id="back" type="button">' + ICON.back + "Songs</button>" +
      '<p class="small-title">Add a song</p></header>' +
      '<div class="choices">' + scanCard +
      '<button class="choice" id="go-type" type="button"><span class="ico">' + ICON.keys + "</span>" +
      "<span><b>Type it in</b><span>Fill in the title, capo, chord and words yourself.</span></span></button></div>";
    document.getElementById("back").addEventListener("click", goBack);
    var gs = document.getElementById("go-scan");
    if (gs) gs.addEventListener("click", function () { photos = []; go({ name: "scan" }); });
    document.getElementById("go-type").addEventListener("click", function () { go({ name: "edit" }, true); });
  }

  function renderScan() {
    if (scanState === "off") return renderAdd();
    document.title = "Scan a sheet · Dave's Tunes";
    var thumbs = photos.map(function (f, i) {
      return '<figure class="thumb"><img alt="Page ' + (i + 1) + '" src="' + f.url + '">' +
        '<button class="sq rot" type="button" data-rot="' + i + '" aria-label="Turn page ' + (i + 1) + '">' + ICON.rotate + "</button>" +
        '<button class="sq" type="button" data-rm="' + i + '" aria-label="Remove page ' + (i + 1) + '">×</button>' +
        "<figcaption>Page " + (i + 1) + "</figcaption></figure>";
    }).join("");
    var canAdd = photos.length < maxPhotos;
    app.innerHTML =
      '<header class="topbar"><button class="btn ghost" id="back" type="button">' + ICON.back + "Back</button>" +
      '<p class="small-title">Scan a paper sheet</p></header>' +
      '<div class="scan">' +
        (photos.length
          ? '<p class="lead">' + (photos.length === 1 ? "Got it." : "Got " + photos.length + " pages.") +
            " Make sure the words are the right way up (tap ↻ to turn the photo). If the song runs onto another page, add that too.</p><div class=\"thumbs\">" + thumbs + "</div>"
          : '<p class="lead">Lay the sheet flat in good light and take a photo from straight above, so all the words are in the picture.</p>') +
        // Real <label>s over the file inputs: some phones ignore a script "click" on a hidden input
        '<input class="vh" id="photo" type="file" accept="image/*" capture="environment" tabindex="-1">' +
        '<input class="vh" id="photo-lib" type="file" accept="image/*" tabindex="-1">' +
        '<div class="scan-actions">' +
          (canAdd ? '<label class="btn ' + (photos.length ? "" : "primary ") + 'big" for="photo" tabindex="0" role="button">' + ICON.camera +
            (photos.length ? "Add another page" : "Take a photo") + "</label>" : "") +
          (photos.length ? '<button class="btn primary big" id="read" type="button">' + ICON.check + "Read the sheet</button>" : "") +
          (canAdd && !photos.length ? '<label class="btn ghost" for="photo-lib" tabindex="0" role="button">Choose a photo already taken</label>' : "") +
        "</div>" +
        '<div class="reading" id="reading" hidden><div class="spinner" aria-hidden="true"></div>' +
          '<p><b>Reading the sheet…</b><br>This can take up to a minute.</p>' +
          '<button class="btn" id="stop" type="button">Stop</button></div>' +
        '<p class="error" id="scan-error" role="alert" hidden></p>' +
      "</div>";
    document.getElementById("back").addEventListener("click", goBack);
    function addFile(input) {
      var f = input.files && input.files[0];
      input.value = "";
      if (!f) return;
      var ph = { file: f, rot: 0 };
      preparePhoto(ph).then(function () { photos.push(ph); renderScan(); }, function () {
        var err = document.getElementById("scan-error");
        err.textContent = "That photo couldn\u2019t be opened. Try taking it again."; err.hidden = false;
      });
    }
    var cam = document.getElementById("photo"), lib = document.getElementById("photo-lib");
    cam.addEventListener("change", function () { addFile(cam); });
    lib.addEventListener("change", function () { addFile(lib); });
    app.querySelectorAll("label[for]").forEach(function (l) {
      l.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); document.getElementById(l.htmlFor).click(); }
      });
    });
    app.querySelectorAll("[data-rm]").forEach(function (b) {
      b.addEventListener("click", function () {
        var i = Number(b.getAttribute("data-rm"));
        URL.revokeObjectURL(photos[i].url); photos.splice(i, 1); renderScan();
      });
    });
    app.querySelectorAll("[data-rot]").forEach(function (b) {
      b.addEventListener("click", function () {
        var ph = photos[Number(b.getAttribute("data-rot"))];
        ph.rot = (ph.rot + 90) % 360;
        preparePhoto(ph).then(renderScan);
      });
    });
    var rd = document.getElementById("read"); if (rd) rd.addEventListener("click", readSheet);
    document.getElementById("stop").addEventListener("click", function () { if (scanCtl) scanCtl.abort(); });
  }

  var SCAN_ERRORS = {
    not_granted: "Photo reading was turned off for this page, so please type the song in.",
    sampling_disabled: "Photo reading isn’t available on this account, so please type the song in.",
    images_unavailable: "Photo reading isn’t available on this device, so please type the song in.",
    image_rejected: "That photo couldn’t be opened. Try taking it again.",
    rate_limited: "Too many sheets read in a short time. Wait a few minutes and try again.",
    session_expired: "You’ve been signed out. Sign in again, then try once more.",
    refused: "This sheet couldn’t be read. Try a clearer photo, or type the song in.",
    invalid_json: "The sheet came back jumbled. Tap Read the sheet to try again.",
    empty_completion: "No words were found. Try a clearer, closer photo.",
    ocr_load: "The photo reader couldn\u2019t start. Connect to Wi-Fi and try again."
  };

  function loadTesseract() {
    return new Promise(function (resolve, reject) {
      if (window.Tesseract) return resolve(window.Tesseract);
      var s = document.createElement("script");
      s.src = ocrUrl("tesseract.min.js");
      s.onload = function () { window.Tesseract ? resolve(window.Tesseract) : reject({ code: "ocr_load" }); };
      s.onerror = function () { s.remove(); reject({ code: "ocr_load" }); };
      document.head.appendChild(s);
    });
  }

  // Draw the photo upright (phones store many photos sideways with a "turn me" note that <img> honours
  // but the reader ignores), apply any extra turns, shrink it, and keep that version for reading.
  function preparePhoto(ph) {
    return new Promise(function (resolve, reject) {
      var src = URL.createObjectURL(ph.file), img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(src);
        var w = img.naturalWidth, hgt = img.naturalHeight, scale = Math.min(1, 2400 / Math.max(w, hgt));
        w = Math.round(w * scale); hgt = Math.round(hgt * scale);
        var side = ph.rot % 180 !== 0, cv = document.createElement("canvas");
        cv.width = side ? hgt : w; cv.height = side ? w : hgt;
        var ctx = cv.getContext("2d");
        ctx.translate(cv.width / 2, cv.height / 2);
        ctx.rotate(ph.rot * Math.PI / 180);
        ctx.drawImage(img, -w / 2, -hgt / 2, w, hgt);
        cv.toBlob(function (blob) {
          if (!blob) return reject();
          if (ph.url) URL.revokeObjectURL(ph.url);
          ph.blob = blob; ph.url = URL.createObjectURL(blob);
          resolve(ph);
        }, "image/jpeg", 0.92);
      };
      img.onerror = function () { URL.revokeObjectURL(src); reject(); };
      img.src = src;
    });
  }

  // Tidy what the reader saw: drop page furniture ("1 of 2", dates), turn "(1)" into [Verse 1]
  // and CHORUS into [Chorus].
  function tidyLine(l) {
    l = l.replace(/^\s*\d+\s+of\s+\d+\s+/i, "").replace(/\s+\d{4}[-\/.]\d{1,2}[-\/.]\d{1,2}\s*$/, "");
    if (/^\s*\d+\s+of\s+\d+\s*$/i.test(l) || /^\s*\d{4}[-\/.]\d{1,2}[-\/.]\d{1,2}\s*$/.test(l)) return "";
    if (/^\s*(chorus|refrain)\s*:?\s*$/i.test(l)) return "[Chorus]";
    if (/^\s*bridge\s*:?\s*$/i.test(l)) return "[Bridge]";
    var v = l.match(/^\s*[(\[{]?\s*(\d{1,2})\s*[)\]}.]\s+(.*)$/);
    if (v) return "[Verse " + v[1] + "]\n" + v[2];
    return l;
  }
  function titleFrom(line) {
    var words = line.replace(/^\[.*\]\s*/, "").split(/[,;.!?]/)[0].trim().split(/\s+/).slice(0, 6);
    return words.map(function (w) { return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase(); }).join(" ");
  }

  // Turn the photo reader's plain text into a song: pull out "1-C" / "Capo 3" and a title from the top.
  function songFromText(text) {
    var lines = String(text).replace(/\r/g, "").split("\n").map(function (l) { return l.replace(/\s+$/, ""); });
    var capo = 0, chord = "", title = "";
    for (var i = 0; i < Math.min(lines.length, 8); i++) {
      var l = lines[i], m = l.match(/(?:^|\s)(\d{1,2})\s*[-\u2013\u2014]\s*([A-G][#b]?m?)(?=\s|$)/);
      var c = l.match(/capo\s*(?:on\s*)?(\d{1,2})/i);
      if (m && Number(m[1]) <= 12) { capo = Number(m[1]); chord = m[2]; lines[i] = l.replace(m[0], "").trim(); break; }
      if (c && Number(c[1]) <= 12) { capo = Number(c[1]); lines[i] = l.replace(c[0], "").trim(); break; }
    }
    lines = lines.map(tidyLine).join("\n").split("\n");
    while (lines.length && !lines[0].trim()) lines.shift();
    // A short first line is the title; otherwise borrow the song's opening words, as hymnals do.
    if (lines.length && lineClass(lines[0]) === "ln" && lines[0].trim().length <= 40 && !/[,;]$/.test(lines[0].trim())) title = lines.shift().trim();
    else for (var t = 0; t < lines.length && !title; t++) if (lineClass(lines[t]) === "ln" && lines[t].trim()) title = titleFrom(lines[t]);
    if (!chord) {
      for (var j = 0; j < lines.length && !chord; j++) if (lineClass(lines[j]) === "ln chord") chord = lines[j].trim().split(/\s+/)[0];
    }
    // The reader often leaves a blank line between a chord line and its words; close that gap.
    lines = lines.filter(function (l, k) {
      return !(!l.trim() && k > 0 && lineClass(lines[k - 1]) === "ln chord" && lines[k + 1] && lineClass(lines[k + 1]) === "ln" && lines[k + 1].trim());
    });
    lines = lines.reduce(function (acc, l) {
      if (lineClass(l) === "ln section" && acc.length && acc[acc.length - 1].trim()) acc.push("");
      acc.push(l); return acc;
    }, []);
    var lyrics = lines.join("\n").replace(/^\s*\n/, "").replace(/\n{3,}/g, "\n\n").replace(/\s+$/, "");
    return { title: title, artist: "", capo: capo, chord: chord, lyrics: lyrics };
  }

  // Keep the lines the reader is sure of (skipping smudges, the tablecloth and scribbles in the
  // margin). Words far off to the side of a line are margin notes, unless the line is chords.
  function cleanLine(t) {
    // The reader sometimes doubles a lone chord letter ("Cc") or drops its case; fix that first.
    var asChords = t.replace(/(^|\s)([A-Ga-g])\2?(?=\s|$)/gi, function (m, sp, c) { return sp + c.toUpperCase() + (m.length - sp.length > 1 ? " " : ""); });
    if (lineClass(asChords) === "ln chord") return asChords.replace(/\s+$/, "");
    if (lineClass(t) === "ln chord") return t;
    var segs = t.split(/\s{4,}/).map(function (s) { return s.trim(); }).filter(Boolean);
    var keep = segs.filter(function (s) {
      return (s.match(/[A-Za-z]/g) || []).length >= 6 || lineClass(s) === "ln chord" || /^\(?\d{1,2}\)$/.test(s) ||
        /^\d{1,2}\s*[-\u2013\u2014]\s*[A-G][#b]?m?$/.test(s) || /^capo\b/i.test(s);
    });
    return keep.join(" ").replace(/(^|\s)\|(?=\s|$)/g, "$1I").replace(/\s{2,}/g, " ").replace(/^[^A-Za-z0-9(\[]+/, "");
  }
  function pageText(data) {
    if (!data.blocks || !data.blocks.length) return data.text || "";
    var out = [];
    data.blocks.forEach(function (b) {
      (b.paragraphs || []).forEach(function (par) {
        (par.lines || []).forEach(function (ln) {
          if (ln.confidence < 50) return;
          var t = cleanLine(ln.text.replace(/\s+$/, ""));
          if (t && (t.match(/[A-Za-z]/g) || []).length >= Math.max(1, t.replace(/\s/g, "").length * 0.5)) out.push(t);
        });
      });
    });
    return out.join("\n");
  }

  function readWithOcr(onProgress) {
    var worker = null, files = photos.map(function (p) { return p.blob || p.file; }), texts = [];
    var stopped = false;
    scanCtl = { abort: function () { stopped = true; if (worker) worker.terminate(); } };
    return loadTesseract().then(function (T) {
      return T.createWorker("eng", 1, {
        workerPath: ocrUrl("worker.min.js"), corePath: ocrUrl("core"), langPath: ocrUrl("lang"),
        logger: function (m) {
          if (m.status === "recognizing text") onProgress(texts.length, files.length, m.progress);
        }
      });
    }).then(function (w) {
      worker = w;
      if (stopped) throw { code: "cancelled" };
      // One block of text reads Dave's sheets best; the default layout mode tears verses apart.
      return w.setParameters({ preserve_interword_spaces: "1", tessedit_pageseg_mode: "6" });
    }).then(function () {
      return files.reduce(function (chain, f) {
        return chain.then(function () {
          if (stopped) throw { code: "cancelled" };
          return worker.recognize(f, {}, { text: true, blocks: true }).then(function (r) { texts.push(pageText(r.data)); });
        });
      }, Promise.resolve());
    }).then(function () {
      worker.terminate();
      var song = songFromText(texts.join("\n\n"));
      if (!song.lyrics && !song.title) throw { code: "empty_completion" };
      song.ocr = true;
      return song;
    }).catch(function (e) {
      if (worker) try { worker.terminate(); } catch (x) {}
      throw stopped ? { code: "cancelled" } : (e && e.code ? e : { code: "ocr_load" });
    });
  }

  function readWithClaude() {
    scanCtl = new AbortController();
    return scanner.json(SCAN_PROMPT, { images: photos.map(function (p) { return p.blob || p.file; }), signal: scanCtl.signal });
  }

  function readSheet() {
    var reading = document.getElementById("reading"), err = document.getElementById("scan-error");
    var actions = app.querySelector(".scan-actions"), note = reading.querySelector("p");
    reading.hidden = false; actions.hidden = true; err.hidden = true;
    var job = engine === "ocr"
      ? readWithOcr(function (done, total, frac) {
          var pct = Math.round(((done + (frac || 0)) / total) * 100);
          note.innerHTML = "<b>Reading the sheet\u2026 " + pct + "%</b><br>Keep this screen open.";
        })
      : readWithClaude();
    job
      .then(function (r) {
        if (!r || typeof r !== "object") throw { code: "invalid_json" };
        var capo = Math.round(Number(r.capo)); if (!(capo >= 0 && capo <= 12)) capo = 0;
        draft = {
          title: String(r.title || "").trim(), artist: String(r.artist || "").trim(),
          capo: capo, chord: String(r.chord || "").trim(), lyrics: String(r.lyrics || "").replace(/\s+$/, ""),
          scanned: true, ocr: !!r.ocr
        };
        photos.forEach(function (p) { URL.revokeObjectURL(p.url); }); photos = [];
        go({ name: "edit", draft: true }, true);
      })
      .catch(function (e) {
        if (view.name !== "scan") return;
        reading.hidden = true; actions.hidden = false;
        if (e && e.code === "cancelled") return;
        if (e && ["not_granted", "sampling_disabled", "images_unavailable"].indexOf(e.code) !== -1) scanState = "off";
        err.textContent = (e && SCAN_ERRORS[e.code]) || "Something went wrong reading the sheet. Tap Read the sheet to try again.";
        err.hidden = false;
      });
  }

  // ---------- Add / edit ----------
  var draft = null;
  var COMMON_CHORDS = ["C", "D", "E", "F", "G", "A", "B", "Am", "Dm", "Em"];
  function goBack() { history.length > 1 ? history.back() : go({ name: "list" }, true); }

  function renderEdit(s, fromDraft) {
    var isNew = !s;
    s = s || fromDraft || { title: "", artist: "", capo: 0, chord: "", lyrics: "" };
    document.title = (isNew ? "Add song" : "Edit song") + " · Dave's Tunes";
    var start = JSON.stringify([s.title, s.artist, Number(s.capo) || 0, s.chord, s.lyrics]);
    var chips = COMMON_CHORDS.map(function (c) {
      return '<button class="chip" type="button" data-chord="' + c + '">' + c + "</button>";
    }).join("");
    app.innerHTML =
      '<header class="topbar"><button class="btn ghost" id="cancel" type="button">' + ICON.back + "Cancel</button>" +
      '<p class="small-title">' + (isNew ? "Add a song" : "Edit song") + "</p></header>" +
      '<div class="leave" id="leave" hidden><p>Leave without saving? Your changes will be lost.</p>' +
        '<div class="form-actions"><button class="btn danger" id="leave-yes" type="button">Leave</button>' +
        '<button class="btn primary" id="leave-no" type="button">Keep editing</button></div></div>' +
      '<form class="form" id="form" novalidate>' +
        (fromDraft && fromDraft.scanned
          ? '<div class="banner">' + ICON.check + "<p><b>Here’s what was read from the sheet.</b> Check the words and chords against the paper, fix anything that’s wrong, then tap Save song." +
            (fromDraft.ocr ? " Handwriting and chords often come out wrong, so look closely." : "") + "</p></div>"
          : "") +
        '<div class="field"><label for="f-title">Song title</label><input id="f-title" required autocapitalize="words" value="' + esc(s.title) + '"></div>' +
        '<div class="field"><label for="f-artist">Who sings it <span class="hint">(optional)</span></label><input id="f-artist" autocapitalize="words" value="' + esc(s.artist) + '"></div>' +
        '<div class="field"><span class="label" id="capo-lbl">Capo fret</span>' +
          '<div class="stepper" role="group" aria-labelledby="capo-lbl">' +
            '<button class="sq" id="capo-down" type="button" aria-label="Capo lower">−</button>' +
            '<output id="f-capo" aria-live="polite"></output>' +
            '<button class="sq" id="capo-up" type="button" aria-label="Capo higher">+</button></div></div>' +
        '<div class="field"><label for="f-chord">Starting chord</label>' +
          '<div class="chips" id="chips">' + chips + "</div>" +
          '<input id="f-chord" autocapitalize="characters" autocomplete="off" placeholder="Tap one above or type it, like C or F#m" value="' + esc(s.chord) + '"></div>' +
        '<div class="showas"><span class="hint">Shows at the top of the song as</span><span class="preview" id="f-preview"></span></div>' +
        '<div class="field"><label for="f-lyrics">Words and chords</label>' +
          '<span class="hint">Put chords on their own line above the words. Lines like [Chorus] become small headings.</span>' +
          '<textarea id="f-lyrics" spellcheck="false">' + esc(s.lyrics) + "</textarea></div>" +
        '<p class="error" id="f-error" role="alert" hidden></p>' +
        (isNew ? "" :
          '<div class="danger-zone"><button class="btn danger" id="del" type="button">Delete this song</button>' +
          '<div class="confirm" id="confirm" hidden><p>Delete “' + esc(s.title) + '” for good?</p>' +
          '<div class="form-actions"><button class="btn danger" id="del-yes" type="button">Yes, delete it</button>' +
          '<button class="btn" id="del-no" type="button">Keep it</button></div></div></div>') +
        '<div class="savebar"><button class="btn primary big" type="submit">' + ICON.check + "Save song</button></div>" +
      "</form>";

    var capoVal = Number(s.capo) || 0;
    var capoOut = document.getElementById("f-capo"), chord = document.getElementById("f-chord");
    function current() {
      return [document.getElementById("f-title").value.trim(), document.getElementById("f-artist").value.trim(),
        capoVal, chord.value.trim(), document.getElementById("f-lyrics").value.replace(/\s+$/, "")];
    }
    function sync() {
      capoOut.textContent = capoVal === 0 ? "No capo" : capoVal;
      document.getElementById("capo-down").disabled = capoVal <= 0;
      document.getElementById("capo-up").disabled = capoVal >= 12;
      document.getElementById("f-preview").textContent = capoLabel({ capo: capoVal, chord: chord.value.trim() || "?" });
      app.querySelectorAll(".chip").forEach(function (c) { c.classList.toggle("on", c.getAttribute("data-chord") === chord.value.trim()); });
    }
    document.getElementById("capo-down").addEventListener("click", function () { capoVal = Math.max(0, capoVal - 1); sync(); });
    document.getElementById("capo-up").addEventListener("click", function () { capoVal = Math.min(12, capoVal + 1); sync(); });
    document.getElementById("chips").addEventListener("click", function (e) {
      var c = e.target.closest(".chip"); if (!c) return;
      chord.value = c.getAttribute("data-chord"); sync();
    });
    chord.addEventListener("input", sync);
    sync();

    var leave = document.getElementById("leave");
    document.getElementById("cancel").addEventListener("click", function () {
      var changed = JSON.stringify(current()) !== start || (fromDraft && fromDraft.scanned);
      if (!changed) return goBack();
      leave.hidden = false; window.scrollTo(0, 0);
    });
    document.getElementById("leave-yes").addEventListener("click", function () { draft = null; goBack(); });
    document.getElementById("leave-no").addEventListener("click", function () { leave.hidden = true; });

    document.getElementById("form").addEventListener("submit", function (e) {
      e.preventDefault();
      var v = current(), err = document.getElementById("f-error");
      if (!v[0]) {
        err.textContent = "Give the song a title so you can find it later."; err.hidden = false;
        document.getElementById("f-title").focus(); return;
      }
      var data = { title: v[0], artist: v[1], capo: v[2], chord: v[3], lyrics: v[4] };
      var id;
      if (isNew) {
        id = "u-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        data.id = id; songs.push(data);
      } else {
        id = view.id;
        var existing = findSong(id);
        for (var k in data) existing[k] = data[k];
        delete existing.sample;
      }
      save(KEY, songs);
      draft = null;
      toast(isNew ? "Song added" : "Song saved");
      if (isNew) go({ name: "song", id: id }, true);
      else history.back();  // return to the song page it was opened from
    });
    if (!isNew) {
      var box = document.getElementById("confirm"), del = document.getElementById("del");
      del.addEventListener("click", function () { box.hidden = false; del.hidden = true; box.scrollIntoView({ block: "center" }); });
      document.getElementById("del-no").addEventListener("click", function () { box.hidden = true; del.hidden = false; });
      document.getElementById("del-yes").addEventListener("click", function () {
        songs = songs.filter(function (x) { return x.id !== view.id; });
        delete prefs.speeds[view.id]; save(PREFS, prefs);
        save(KEY, songs);
        toast("Song deleted");
        go({ name: "list" }, true);
      });
    }
  }

  // ---------- Start ----------
  try { history.replaceState(view, ""); } catch (e) {}
  render();

  // Offline support when hosted as an installed app (not available inside every viewer, so failures are ignored)
  try {
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }
  } catch (e) {}
})();
</script>
